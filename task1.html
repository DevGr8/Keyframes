<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Challenge</title>
    <style>
        .task-box {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        h3 { color: #444; margin-bottom: 15px; }

        .blinking-text {
            font-size: 1.5rem;
            font-weight: bold;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; color: #333; }
            50% { opacity: 0; color: #007bff; }
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .dot {
            width: 15px;
            height: 15px;
            margin: 0 5px;
            background-color: #3498db;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 0.6s var(--delay) infinite alternate ease-in-out;
        }

        @keyframes bounce {
            from { 
            transform: translateY(0); 
            }
            to { 
            transform: translateY(-20px); 
        }
}

        .floating-icon {
            font-size: 50px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        .progress-container {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #81c784);
            animation: slide 2.5s ease-in-out infinite;
        }
        @keyframes slide {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="text-align: center; color: #222;">Mini Challenge Solutions</h1>

        <div class="task-box">
            <h3>1. Blinking Text</h3>
            <div class="blinking-text">LOADING...</div>
        </div>

        <div class="task-box">
            <h3>2. Rotating Loader</h3>
            <div class="loader"></div>
        </div>

        <div class="task-box">
            <h3>3. Bouncing Dots</h3>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="task-box">
            <h3>4. Floating Icon</h3>
            <div class="floating-icon">🚀</div>
        </div>

        <div class="task-box">
            <h3>5. Sliding Progress Bar</h3>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

</body>
</html>
